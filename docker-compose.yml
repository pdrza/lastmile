services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: optiroute-db
    environment:
      POSTGRES_DB: optiroute
      POSTGRES_USER: optiroute
      POSTGRES_PASSWORD: optiroute123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiroute -d optiroute"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: optiroute-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
