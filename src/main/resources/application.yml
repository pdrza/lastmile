spring:
  application:
    name: optiroute

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/optiroute}
    username: ${DB_USERNAME:optiroute}
    password: ${DB_PASSWORD:optiroute123}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:insecure-dev-secret-replace-in-production-with-256-bit-key}
    expiration-hours: 24

  geocoding:
    api-key: ${ORS_API_KEY:}
    base-url: https://api.openrouteservice.org

logging:
  level:
    com.lastmile.optiroute: DEBUG
    org.springframework.security: INFO
